<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - SkillPath</title>
  <meta name="description" content="Reset your SkillPath account password.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Supabase CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="auth-page-body">

  <header class="auth-navbar">
    <div class="container auth-nav-container">
      <a href="index.html" class="brand" aria-label="SkillPath Home">
        <div class="brand-icon">⚡</div>
        <span>Skill<span class="brand-accent">Path</span></span>
      </a>
      <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge-icon">🔐</div>
        <h1 class="auth-title">Forgot your password?</h1>
        <p class="auth-subtitle">Enter your registered email address and we'll send you a link to reset your password.</p>
      </div>

      <div id="authAlert" class="auth-alert" role="alert" style="display: none;"></div>

      <form id="formForgotPassword" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="req">*</span></label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="student@example.com"
            required
            autocomplete="email"
          >
          <div class="field-error" id="emailError"></div>
        </div>

        <button type="submit" id="btnSubmitForgot" class="btn btn-primary auth-submit-btn">
          <span id="submitBtnText">Send Reset Link</span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p>Remember your password? <a href="login.html" class="auth-link">Back to log in</a></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('formForgotPassword');
      const submitBtn = document.getElementById('btnSubmitForgot');
      const submitBtnText = document.getElementById('submitBtnText');
      const alertBox = document.getElementById('authAlert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const email = document.getElementById('email').value.trim();

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
          showFieldError('emailError', 'Please enter your email address.');
          return;
        } else if (!emailRegex.test(email)) {
          showFieldError('emailError', 'Please enter a valid email address.');
          return;
        }

        setLoading(true);

        try {
          await SkillPathAuth.resetPasswordForEmail(email);
          setLoading(false);
          showAlert(
            'success',
            '📩 We have sent a password reset link to ' + escapeHtml(email) + '. Please check your inbox (and spam folder) and click the link to choose a new password.'
          );
          form.reset();
        } catch (err) {
          setLoading(false);
          showAlert('error', err.message || 'Unable to send reset email. Please try again.');
        }
      });

      function clearErrors() {
        document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
        alertBox.style.display = 'none';
        alertBox.className = 'auth-alert';
        alertBox.textContent = '';
      }

      function showFieldError(elementId, message) {
        const el = document.getElementById(elementId);
        if (el) el.textContent = message;
      }

      function showAlert(type, message) {
        alertBox.className = `auth-alert alert-${type}`;
        alertBox.innerHTML = message;
        alertBox.style.display = 'block';
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          submitBtn.classList.add('btn-loading');
          submitBtnText.textContent = 'Sending Link...';
        } else {
          submitBtn.classList.remove('btn-loading');
          submitBtnText.textContent = 'Send Reset Link';
        }
      }
    });
  </script>
</body>
</html>

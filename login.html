<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - SkillPath</title>
  <meta name="description" content="Log in to your SkillPath account to access your IT learning roadmaps, weekly planner, and progress tracker.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Supabase CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="auth-page-body">

  <!-- Minimal Brand Header -->
  <header class="auth-navbar">
    <div class="container auth-nav-container">
      <a href="index.html" class="brand" aria-label="SkillPath Home">
        <div class="brand-icon">⚡</div>
        <span>Skill<span class="brand-accent">Path</span></span>
      </a>
      <a href="register.html" class="btn btn-primary btn-sm">Sign Up</a>
    </div>
  </header>

  <!-- Auth Container -->
  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge-icon">🔑</div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your SkillPath account to continue your learning journey.</p>
      </div>

      <!-- Alert Box -->
      <div id="authAlert" class="auth-alert" role="alert" style="display: none;"></div>

      <form id="formLogin" novalidate>
        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="req">*</span></label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="student@example.com"
            required
            autocomplete="email"
          >
          <div class="field-error" id="emailError"></div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="label-with-link">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password <span class="req">*</span></label>
            <a href="forgot-password.html" class="auth-sublink">Forgot password?</a>
          </div>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            >
            <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Show password">👁️</button>
          </div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <!-- Remember Me Checkbox -->
        <div class="form-group-checkbox">
          <label class="custom-checkbox-label">
            <input type="checkbox" id="rememberMe" class="custom-checkbox" checked>
            <span>Remember me on this device</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btnSubmitLogin" class="btn btn-primary auth-submit-btn">
          <span id="submitBtnText">Log In</span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p>New here? <a href="register.html" class="auth-link">Create an account</a></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if already logged in
      await SkillPathAuth.redirectIfAuthenticated();

      // Show/hide password button
      SkillPathAuth.initPasswordToggle('togglePassword', 'password');

      const form = document.getElementById('formLogin');
      const submitBtn = document.getElementById('btnSubmitLogin');
      const submitBtnText = document.getElementById('submitBtnText');
      const alertBox = document.getElementById('authAlert');

      // Check URL parameters for status messages (e.g. after reset)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('message') === 'password_reset_success') {
        showAlert('success', 'Your password has been successfully updated. Please log in with your new password.');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;

        let hasError = false;

        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!email) {
          showFieldError('emailError', 'Please enter your email address.');
          hasError = true;
        } else if (!emailRegex.test(email)) {
          showFieldError('emailError', 'Please enter a valid email address.');
          hasError = true;
        }

        if (!password) {
          showFieldError('passwordError', 'Please enter your password.');
          hasError = true;
        }

        if (hasError) return;

        setLoading(true);

        try {
          await SkillPathAuth.signIn(email, password, rememberMe);

          showAlert('success', 'Signed in successfully! Redirecting...');

          // Determine redirect destination
          const redirectDestination = urlParams.get('redirect') || 'index.html';
          setTimeout(() => {
            window.location.href = redirectDestination;
          }, 600);
        } catch (err) {
          setLoading(false);
          let message = err.message || 'Invalid login credentials.';
          if (message.includes('Invalid login credentials')) {
            message = 'Invalid email or password. Please try again.';
          } else if (message.includes('Email not confirmed')) {
            message = 'Please verify your email address before logging in. Check your inbox for the confirmation link.';
          }
          showAlert('error', message);
        }
      });

      function clearErrors() {
        document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
        alertBox.style.display = 'none';
        alertBox.className = 'auth-alert';
        alertBox.textContent = '';
      }

      function showFieldError(elementId, message) {
        const el = document.getElementById(elementId);
        if (el) el.textContent = message;
      }

      function showAlert(type, message) {
        alertBox.className = `auth-alert alert-${type}`;
        alertBox.textContent = message;
        alertBox.style.display = 'block';
        alertBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          submitBtn.classList.add('btn-loading');
          submitBtnText.textContent = 'Signing in...';
        } else {
          submitBtn.classList.remove('btn-loading');
          submitBtnText.textContent = 'Log In';
        }
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - SkillPath</title>
  <meta name="description" content="Set a new password for your SkillPath account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Supabase CDN & Config -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>
<body class="auth-page-body">

  <header class="auth-navbar">
    <div class="container auth-nav-container">
      <a href="index.html" class="brand" aria-label="SkillPath Home">
        <div class="brand-icon">⚡</div>
        <span>Skill<span class="brand-accent">Path</span></span>
      </a>
      <a href="login.html" class="btn btn-outline btn-sm">Log In</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-badge-icon">🔄</div>
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-subtitle">Please enter and confirm your new secure password.</p>
      </div>

      <div id="authAlert" class="auth-alert" role="alert" style="display: none;"></div>

      <form id="formResetPassword" novalidate>
        <!-- New Password -->
        <div class="form-group">
          <label for="newPassword" class="form-label">New Password <span class="req">*</span></label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="newPassword"
              class="form-control"
              placeholder="At least 8 characters (letters & numbers)"
              required
              autocomplete="new-password"
              minlength="8"
            >
            <button type="button" id="toggleNewPassword" class="password-toggle-btn" aria-label="Show password">👁️</button>
          </div>
          <div class="field-error" id="newPasswordError"></div>
          <p class="form-hint">Must be at least 8 characters and include at least one letter and one number.</p>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group">
          <label for="confirmNewPassword" class="form-label">Confirm New Password <span class="req">*</span></label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="confirmNewPassword"
              class="form-control"
              placeholder="Re-enter your new password"
              required
              autocomplete="new-password"
            >
            <button type="button" id="toggleConfirmNewPassword" class="password-toggle-btn" aria-label="Show password">👁️</button>
          </div>
          <div class="field-error" id="confirmNewPasswordError"></div>
        </div>

        <button type="submit" id="btnSubmitReset" class="btn btn-primary auth-submit-btn">
          <span id="submitBtnText">Update Password</span>
        </button>
      </form>

      <div class="auth-card-footer">
        <p><a href="login.html" class="auth-link">Return to Log In</a></p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SkillPathAuth.initPasswordToggle('toggleNewPassword', 'newPassword');
      SkillPathAuth.initPasswordToggle('toggleConfirmNewPassword', 'confirmNewPassword');

      const form = document.getElementById('formResetPassword');
      const submitBtn = document.getElementById('btnSubmitReset');
      const submitBtnText = document.getElementById('submitBtnText');
      const alertBox = document.getElementById('authAlert');

      // Check if session or recovery token is present
      const client = SkillPathAuth.getClient();
      if (client) {
        client.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            // Password recovery event triggered from recovery email link
            showAlert('info', 'Recovery link verified! Please enter your new password below.');
          }
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearErrors();

        const newPassword = document.getElementById('newPassword').value;
        const confirmNewPassword = document.getElementById('confirmNewPassword').value;

        let hasError = false;

        const passwordLetterAndNumber = /^(?=.*[A-Za-z])(?=.*\d).{8,}$/;
        if (!newPassword) {
          showFieldError('newPasswordError', 'Please enter a new password.');
          hasError = true;
        } else if (newPassword.length < 8) {
          showFieldError('newPasswordError', 'Password must be at least 8 characters.');
          hasError = true;
        } else if (!passwordLetterAndNumber.test(newPassword)) {
          showFieldError('newPasswordError', 'Password must include at least one letter and one number.');
          hasError = true;
        }

        if (!confirmNewPassword) {
          showFieldError('confirmNewPasswordError', 'Please confirm your new password.');
          hasError = true;
        } else if (newPassword !== confirmNewPassword) {
          showFieldError('confirmNewPasswordError', 'Passwords do not match.');
          hasError = true;
        }

        if (hasError) return;

        setLoading(true);

        try {
          await SkillPathAuth.updatePassword(newPassword);
          showAlert('success', '🎉 Password updated successfully! Redirecting to login...');
          setTimeout(() => {
            window.location.href = 'login.html?message=password_reset_success';
          }, 1500);
        } catch (err) {
          setLoading(false);
          showAlert('error', err.message || 'Unable to update password. Your recovery link may have expired.');
        }
      });

      function clearErrors() {
        document.querySelectorAll('.field-error').forEach(el => el.textContent = '');
        alertBox.style.display = 'none';
        alertBox.className = 'auth-alert';
        alertBox.textContent = '';
      }

      function showFieldError(elementId, message) {
        const el = document.getElementById(elementId);
        if (el) el.textContent = message;
      }

      function showAlert(type, message) {
        alertBox.className = `auth-alert alert-${type}`;
        alertBox.innerHTML = message;
        alertBox.style.display = 'block';
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          submitBtn.classList.add('btn-loading');
          submitBtnText.textContent = 'Updating...';
        } else {
          submitBtn.classList.remove('btn-loading');
          submitBtnText.textContent = 'Update Password';
        }
      }
    });
  </script>
</body>
</html>
